# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit for dew_flow_vscode_kit — `@oleksandrdubyna88/vscode-webview-kit`, a TypeScript package with
# zero runtime dependencies that two VS Code extensions bundle.
#
# The repository's own rules are the review standard: `.agents/PROJECT.md` and the shared family rules
# mounted as a git SUBMODULE at `.agents/conventions`, which may not be checked out for the reviewer — so
# the ones that matter most are restated per path below. Adapted from ConnectOtherAIs' `.coderabbit.yaml`
# (2026-10-02) to this repository's layout: `src/` and `src/test/`, no .NET.
language: "en-US"

reviews:
  # ASSERTIVE, on evidence rather than taste — the setting ConnectOtherAIs measured at 100 % precision over
  # its first two reviews. If precision falls under ~70 % over the next few pull requests, this goes back
  # to "chill" and the measurement goes in the commit message.
  profile: "assertive"
  # Left off: the merge is already blocked until every review conversation is resolved (branch
  # protection), which is the same gate one layer up.
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  # What must be TRUE of a pull request, not merely mentioned in it. Each was bought by a defect in the
  # family. All start in `warning` — a check nobody has watched behave is not a check to block a merge with.
  pre_merge_checks:
    description:
      mode: "warning"
    docstrings:
      mode: "off"
    custom_checks:
      - name: "A measurement states its sample size"
        mode: "warning"
        instructions: |
          Pass/fail criteria: if the pull request description or the code comments quote a NUMBER as
          evidence — a percentage, a count of findings, a token figure, a latency — the same sentence
          or the one beside it must say what it was measured over: how many runs, how many commits,
          how many models. A number without its sample is an advertisement.
          Not applicable to a version number, a line number, a test count, or a size in bytes.
      - name: "A release-only check is tested on every push"
        mode: "warning"
        instructions: |
          Pass/fail criteria: if the diff adds or changes logic that executes ONLY while a release is
          being cut — a shell condition in a release workflow, a packaging step, a version comparison,
          a tag-triggered job — the same pull request must add or change a test that exercises that
          logic in the ordinary suite. A check whose only execution is the release has never run.
      - name: "A bug fix carries a reproducing test"
        mode: "warning"
        instructions: |
          Pass/fail criteria: if the pull request describes fixing a defect — wrong output, a crash, a
          regression, a silent failure — it must also add or change a test that fails without the fix.
          The description or a comment should say what the failing test reported. Not applicable to a
          rename, a comment, a formatting change, or a documentation-only pull request.
      - name: "A test does not read the wall clock"
        mode: "warning"
        instructions: |
          Pass/fail criteria: a test added or changed by this pull request must not depend on the
          current date or time. `Date.now()`, `new Date()` with no argument inside a test, or a fixture
          with a hard-coded date compared against code that asks what day it is — all fail this check
          unless the clock is frozen or injected.
      - name: "No runtime dependency"
        mode: "error"
        instructions: |
          Pass/fail criteria: `package.json` must not gain a `dependencies` entry. This package is bundled
          by esbuild into two extensions, so a dependency here is a dependency in every extension. Build
          and test tooling belongs under `devDependencies`.

  path_filters:
    - "!**/out/**"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/package-lock.json"
    - "!**/*.tgz"
  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        A pure module — anything outside `src/test/` not named in the architecture test's host allowlist —
        must not import `vscode` or a `node:` API: page modules are functions from values to strings. Host
        modules take a narrow PORT (configuration read/update/change, webview postMessage) rather than the
        `vscode` namespace, so they are tested with a fake that is stricter than the real API, never more
        permissive. Everything interpolated into a page reaches it escaped through the repository's ONE
        escaper (`escapeHtml` / `jsonForScript`) — never `${JSON.stringify(...)}` inside a template literal
        that becomes a `<script>`. Webview scripts live inside template literals: no backticks inside them,
        comments included. Cyclomatic complexity of a function must not exceed 4 and a function must not
        exceed 50 lines — flag one that does. Behaviour must stay byte-identical to what ConnectOtherAIs
        shipped for its own configuration; a change to rendered output needs the byte-compat test updated
        with the coai source line it copies, and a stated reason. User-facing text is English, except help
        bodies and the help page's chrome. Every new behaviour has a test under `src/test`.
    - path: "src/test/**/*.ts"
      instructions: |
        A webview page script is an executable artefact: a test of its BEHAVIOUR must RUN it through
        `pageHarness.ts` (`node:vm`, explicit globals, a deadline) and assert on the result — the DOM after
        the script runs, what was posted to the host — never on a substring of the generated source. Source
        assertions are legitimate only where there is no program to run: a nonce, a CSP header, a value
        appearing escaped. An executing test is not automatically a test with teeth: ask what the assertion
        would SEE if the behaviour were removed. A byte-compat test names the coai source line it copies.
        A tree-scanning test has a companion proving its pattern still matches a known instance. Rendered
        output is checked with `assertNoCr`. A test must not read the wall clock.
    - path: "**/*.md"
      instructions: |
        todo/ holds plans not yet done; research/ documents the system as it is. A plan carries a status
        line on line 2-3. A promoted plan records its deviations. Do not flag the narrative commit-message
        and doc style — it is deliberate. Do flag a doc that contradicts the code in the same PR.
    - path: ".github/workflows/*.yml"
      instructions: |
        Every `uses:` is pinned to a full commit SHA with the version in a trailing comment. The suite runs
        on ubuntu-latest AND windows-latest, unfiltered. A check that executes ONLY while a release is cut
        has never actually run — flag one that has no test in the ordinary suite. On Windows the step shell
        is pwsh, which reports only the last native command's exit code: a multi-line `run:` with more than
        one command is a defect.
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: false
    yamllint:
      enabled: true
    eslint:
      enabled: false

  # OFF, deliberately. Both are ON by default, and both write code: a repository where every change goes
  # through a measured gate, a red test and a review round does not want a second author proposing
  # commits nobody planned.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - ".agents/PROJECT.md"
      - ".agents/conventions/common/*.md"
      - ".agents/conventions/typescript/*.md"
