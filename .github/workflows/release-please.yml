name: release-please

# ---------------------------------------------------------------------------
# PROPOSES RELEASES; PUBLISHES NOTHING. On every push to main, release-please reads the conventional
# commits since the last `v*` tag and opens (or updates) one pull request that bumps package.json and
# writes CHANGELOG.md. A PERSON merging that pull request is the decision to release; the run the merge
# triggers then cuts the tag `v<version>` and a published GitHub release, and that release starts
# `release.yml`, which packs, consumes and publishes to npm (README "Release and rollback").
#
# WHY A GITHUB APP TOKEN AND NOT `GITHUB_TOKEN`. From release-please's README: "all resources created by
# release-please (release tag or release pull request) will not trigger future GitHub actions
# workflows". With the default token the release pull request would get no CI and the release would
# start no `release.yml` — a tag standing there with nothing published and NO ERROR. An App installation
# token is an ordinary actor to GitHub, so both happen. Proven end to end in dew_flow_sidecar_rust
# (v0.2.0, 2026-09-21) and dew_flow_connect_other_ais (bugs-v0.3.0, 2026-09-22) with the same App and the
# same two secret names.
#
# THE TAG IS CUT BY THE NEXT RUN, not by the merge itself — the merge is the push that starts that run.
# On `workflow_dispatch` that means dispatching twice, and the first one looks like "nothing happened".
#
# THE COMMIT TYPE IS THE VERSION: `feat:` a minor, `fix:` / `perf:` a patch, `docs:` / `test:` / `ci:` /
# `chore:` / `refactor:` / `build:` nothing (`release-please-config.json`, `$sections`). A commit touching
# only `.github/` is never a release (`exclude-paths`).
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release · propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `contents: read` and nothing more, which is narrower than the siblings' `contents: write` +
    # `pull-requests: write`: those grant the job's GITHUB_TOKEN, and nothing here writes with that token.
    # Every write — the branch, the pull request, its labels, the tag, the release — is made with the App
    # token below, so what this job can change is bounded by the App's own permissions on this one
    # repository and by the token's hour, not by this block.
    permissions:
      contents: read
    steps:
      # SAY WHAT IS MISSING, rather than letting the mint below fail on an empty input: without this,
      # `create-github-app-token` answers an absent secret with a message about a MALFORMED private key,
      # which reads like a broken secret rather than one never set. `secrets` cannot be read by a step's
      # `if:`, so the step always runs and decides in the shell; the private key never reaches the
      # environment — the expression compares it and hands over only `true` or `false`.
      - name: The release App's two secrets must be set in this repository
        env:
          APP_ID_SET: ${{ secrets.RELEASE_PLEASE_APP_ID != '' }}
          APP_KEY_SET: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$APP_ID_SET" = "true" ] && [ "$APP_KEY_SET" = "true" ]; then
            echo "release-please: app credentials present."
            exit 0
          fi
          echo "::error::release-please: this repository has no release App credentials yet."
          echo "  RELEASE_PLEASE_APP_ID          set: $APP_ID_SET" >&2
          echo "  RELEASE_PLEASE_APP_PRIVATE_KEY set: $APP_KEY_SET" >&2
          echo "  Install the dew-flow-release-please App on this repository and add both as repository" >&2
          echo "  Actions secrets (README, 'Release and rollback', 'What the owner creates once')." >&2
          echo "  Nothing is broken; it is not set up yet, and nothing was proposed or released." >&2
          exit 1

      # A token that lives for an hour, scoped to THIS repository (no `owner` / `repositories` input, so the
      # action scopes it to the current one), minted per run rather than stored. `app-id` is deprecated in
      # favour of `client-id` and still works (it warns); it is kept because the secret holds the numeric
      # App ID, the same value the sibling repositories store under the same name.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # THE POINT OF THE WHOLE FILE: with `GITHUB_TOKEN` the release this cuts would start nothing.
          token: ${{ steps.token.outputs.token }}
